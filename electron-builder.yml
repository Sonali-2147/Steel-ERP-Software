appId: com.steel-erp.app
productName: Krishna Steel ERP
directories:
  output: dist-electron-new
  buildResources: build
files:
  - dist/**/*
  - server/**/*
  - electron-main.mjs
  - package.json
  - node_modules/**/*
extraMetadata:
  main: electron-main.mjs
  type: module
win:
  target:
    - nsis
  signingHashAlgorithms: []
  signAndEditExecutable: false
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  perMachine: false
mac:
  target:
    - dmg
linux:
  target:
    - AppImage
    - deb
  category: Office
